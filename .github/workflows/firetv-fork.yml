# Fork build (mefistofelix/SmartTube): stable flavor signed with the fixed key in fork/debug.keystore
# (committed on purpose, so every build updates the previous one in place), published as release fork-N.
# fork/release.sh (dev PC, local gh login) then offers it to the installed apps through firetv-apps/smarttube.json.
name: Fork APK

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Version and signing
        run: |
          # versionCode = upstream code * 1000 + run number: every fork build updates the previous one,
          # also across upstream merges (in-app updater reads firetv-apps/smarttube.json)
          N=${{ github.run_number }}
          CODE=$(grep -m1 -o 'versionCode [0-9]*' smarttubetv/build.gradle | awk '{print $2}')
          sed -i "0,/versionCode [0-9]*/s//versionCode $((CODE * 1000 + N))/" smarttubetv/build.gradle
          sed -i "s/versionName \"\(.*\)\"/versionName \"\1-mf$N\"/" smarttubetv/build.gradle
          grep -m2 -E 'versionCode|versionName' smarttubetv/build.gradle
          {
            echo "storeFile=${{ github.workspace }}/fork/debug.keystore"
            echo "storePassword=android"
            echo "keyAlias=androiddebugkey"
            echo "keyPassword=android"
          } > keystore.properties
          chmod +x gradlew

      - name: Build
        run: ./gradlew assembleStstableRelease

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=${{ github.run_number }}
          CODE=$(grep -m1 -o 'versionCode [0-9]*' smarttubetv/build.gradle | awk '{print $2}')
          NAME=$(grep -m1 -o 'versionName "[^"]*"' smarttubetv/build.gradle | cut -d'"' -f2)
          dir=smarttubetv/build/outputs/apk/ststable/release
          ls -l $dir
          mkdir out
          for abi in universal armeabi-v7a arm64-v8a; do
            cp $dir/*_$abi.apk out/SmartTube-fork-$N-$abi.apk
          done
          gh release create "fork-$N" out/*.apk \
            --target "${{ github.sha }}" \
            --title "SmartTube fork build $N ($NAME)" \
            --notes "versionName=$NAME versionCode=$CODE
          Stable flavor (org.smarttube.stable) with Fire TV voice search through the keyboard dictation.
          Signed with the fork key: uninstall the official SmartTube first."
