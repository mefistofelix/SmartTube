# Fork build (mefistofelix/SmartTube): stable flavor signed with the fixed key in fork/debug.keystore
# (committed on purpose, so every build updates the previous one in place), uploaded as the artifact SmartTube-fork-N.
# fork/release.sh (dev PC, local gh login: a fork token cannot create releases) publishes it as release fork-N and offers it to the installed apps through firetv-apps/smarttube.json.
name: Fork APK

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Version and signing
        run: |
          # versionCode = upstream code * 1000 + run number: every fork build updates the previous one,
          # also across upstream merges (in-app updater reads firetv-apps/smarttube.json)
          N=${{ github.run_number }}
          CODE=$(grep -m1 -o 'versionCode [0-9]*' smarttubetv/build.gradle | awk '{print $2}')
          sed -i "0,/versionCode [0-9]*/s//versionCode $((CODE * 1000 + N))/" smarttubetv/build.gradle
          sed -i "s/versionName \"\(.*\)\"/versionName \"\1-mf$N\"/" smarttubetv/build.gradle
          grep -m2 -E 'versionCode|versionName' smarttubetv/build.gradle
          {
            echo "storeFile=${{ github.workspace }}/fork/debug.keystore"
            echo "storePassword=android"
            echo "keyAlias=androiddebugkey"
            echo "keyPassword=android"
          } > keystore.properties
          chmod +x gradlew

      - name: Build
        run: ./gradlew assembleStstableRelease

      - name: Collect APKs
        run: |
          N=${{ github.run_number }}
          dir=smarttubetv/build/outputs/apk/ststable/release
          ls -l $dir
          mkdir out
          for abi in universal armeabi-v7a arm64-v8a; do
            cp $dir/*_$abi.apk out/SmartTube-fork-$N-$abi.apk
          done
          # read by fork/release.sh
          echo "versionName=$(grep -m1 -o 'versionName "[^"]*"' smarttubetv/build.gradle | cut -d'"' -f2)" > out/version.txt
          echo "versionCode=$(grep -m1 -o 'versionCode [0-9]*' smarttubetv/build.gradle | awk '{print $2}')" >> out/version.txt
          cat out/version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: SmartTube-fork-${{ github.run_number }}
          path: out/
          if-no-files-found: error
